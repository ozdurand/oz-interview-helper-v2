name: Copilot backend — tests, image and deploy

on:
  push:
    branches: [main]
    paths: ["copilot/**", "assets/js/**", "index.html", ".github/workflows/copilot.yml"]
  pull_request:
    paths: ["copilot/**", "assets/js/**", "index.html", ".github/workflows/copilot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: copilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shipped export is up to date with the site
        run: |
          node scripts/export_shipped.js /tmp/shipped.json
          cmp data/shipped-export.json /tmp/shipped.json || { echo "::error::copilot/data/shipped-export.json is stale — run: node copilot/scripts/export_shipped.js"; exit 1; }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Retrieval test
        run: |
          python -m eval.run_eval --no-embeddings --report /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

  infra:
    name: Azure template and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bicep compiles and lints
        run: az bicep build --file copilot/deploy/azure/main.bicep --stdout > /dev/null
      - name: Shell scripts
        run: shellcheck copilot/deploy/azure/*.sh

  image:
    name: Container image (ghcr.io)
    needs: [test, infra]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oz-copilot"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: copilot
          push: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Oz copilot API — dossier knowledge base and hybrid search
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name copilot -p 8000:8000 -e COPILOT_TOKEN=ci-smoke-test-token-0123456789 "${{ steps.name.outputs.image }}"
          for _ in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/search?q=service+bus')" = 401
          curl -fsS -H "Authorization: Bearer ci-smoke-test-token-0123456789" "localhost:8000/search?q=why+a+topic+per+agent&k=1" | grep -q '"group":"jj/'
          docker exec copilot sh -c 'id -u && touch /data/w && rm /data/w'
          docker rm -f copilot
      - name: Can Azure pull it without a password?
        run: |
          docker logout ghcr.io
          if docker manifest inspect "${{ steps.name.outputs.image }}" > /dev/null 2>&1; then
            echo "Image is public — Azure can pull it without a password: \`${{ steps.name.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            msg="The image is private, so Azure can't pull it yet. Make it public once (it only holds code that is already public in this repo): https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/oz-copilot/settings → Change visibility → Public"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Roll out to Azure Container Apps
    needs: image
    # runs once the Azure link is set up (copilot/deploy/azure/github-oidc.sh)
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: copilot-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP || 'oz-copilot-rg' }}
      APP: ${{ vars.AZURE_CONTAINER_APP || 'oz-copilot' }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: New revision with this commit's image
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" -o none
      - name: Wait until it is ready and answering
        run: |
          for _ in $(seq 1 36); do
            out=$(az containerapp show -n "$APP" -g "$RG" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName, properties.configuration.ingress.fqdn]" -o tsv | tr '\n' ' ')
            read -r latest ready fqdn <<< "$out"
            if [ "$latest" = "$ready" ] && curl -fsS --max-time 20 "https://$fqdn/health"; then
              echo; echo "Live: https://$fqdn — revision $ready, image $IMAGE" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 5
          done
          echo "::error::revision $latest did not become ready — az containerapp logs show -n $APP -g $RG --tail 100"
          exit 1
